"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Runs once when a workspace is created. Regenerates the two gitignored artifacts
# (furniture GLBs + CC0 textures) so the app isn't empty/untextured on first launch;
# WASM is rebuilt by `npm run dev`, so it stays out of setup. Host prerequisites are
# idempotent and only attempted on a local Mac.
setup = """
if [ "$CONDUCTOR_IS_LOCAL" = "1" ]; then
  rustup target add wasm32-unknown-unknown
  command -v wasm-pack >/dev/null || brew install wasm-pack
fi
cd web
npm install
npm run ingest:build
npm run textures
"""

# `npm run dev` is `npm run wasm && vite`, so this rebuilds WASM from Rust every start.
# Args after `--` reach vite, binding it to this workspace's assigned port.
run = "cd web && npm run dev -- --port $CONDUCTOR_PORT"

# Each workspace gets its own port and writes assets into its own worktree — no shared
# port/db/stack — so parallel workspaces can run at once.
run_mode = "concurrent"
