name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Warnings fail the build. The tree is clippy-clean today and the cheapest way to
      # keep it that way is to refuse the first warning rather than the hundredth.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Its own job rather than a step in `web`: these tests need no WASM, no browser and
      # no catalog, so they answer in seconds instead of waiting behind a ~9 minute
      # browser suite. They also cover the branches a browser cannot reach on demand —
      # storage throwing, quota exhaustion, a safety net that failed to write.
      - run: npm run test:unit
        working-directory: web

  web:
    name: tsc + browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The furniture GLBs are gitignored but their masters in `web/assets-src/` are
      # committed, so the catalog can be rebuilt here without network access.
      - run: npm run ingest:build
        working-directory: web

      # Deliberately NOT `npm run textures`. That fetches ~9 MB of CC0 sets from an
      # external host, which would make CI both slower and dependent on someone else's
      # uptime. The app runs untextured and the smoke test ignores the resulting 404s.

      - run: npm run wasm
        working-directory: web

      - run: npx tsc --noEmit
        working-directory: web

      - run: npx playwright install --with-deps chromium
        working-directory: web

      - run: npx playwright test
        working-directory: web

      # Traces and failure screenshots are the point of a browser test — keep them so a
      # red run can be looked at rather than guessed at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  plan:
    name: PLAN.md log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: On a PR — full check against the base
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_plan.py "${{ github.event.pull_request.base.sha }}"
      # Branch protection is unavailable on this plan (the API returns 403 "Upgrade to
      # GitHub Pro or make this repository public"), so a red PR check cannot block a
      # merge — #16 was merged four seconds *before* its own log check went red, and took
      # an entry with it. This pass runs after the fact: it cannot prevent the loss, but
      # it marks `main` red within a minute instead of leaving it silent.
      - name: On main — did the merge drop an entry?
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 .github/scripts/check_plan.py "${{ github.event.before }}" --post-merge

  base:
    name: PR targets main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # A PR stacked on another PR's branch can be merged into a base that main has
      # already moved past, and then it reads MERGED while never reaching main. That
      # happened to #18: it targeted `ci-browser-suite`, #17 merged to main from an
      # earlier commit, and the floating-door fix it carried was silently lost.
      #
      # Note this is NOT an `is-ancestor` check against main. This repo squash-merges, so
      # no PR head is ever an ancestor of main — #17's own head is not, and its content
      # landed fine. That check would fail every correctly-merged PR.
      - name: Base branch must be main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::This PR targets '$BASE', not 'main'."
            echo "Stacked PRs can merge into a base that main has already moved past —"
            echo "the PR reads MERGED and its changes never reach main. Retarget to main"
            echo "and rebase, or land the base PR first and reopen against main."
            exit 1
          fi
          echo "base is main"
