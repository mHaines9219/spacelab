<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacelab</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #14161a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 190px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
        pointer-events: none;
      }
      .hud strong {
        margin-bottom: 5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .row span:first-child {
        color: #9a978f;
      }
      .hint {
        margin-top: 8px;
        color: #9a978f;
      }
      .error {
        color: #ff8f7a;
        max-width: 30ch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
