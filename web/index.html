<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacelab</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #14161a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 190px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
        pointer-events: none;
      }
      .hud strong {
        margin-bottom: 5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .hud button,
      .hud input {
        pointer-events: auto;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .row span:first-child {
        color: #9a978f;
      }
      .hint {
        margin-top: 8px;
        color: #9a978f;
      }
      .error {
        color: #ff8f7a;
        max-width: 30ch;
      }
      .panel {
        position: fixed;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 190px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .panel strong {
        margin-bottom: 2px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .panel .hint {
        margin: 0 0 4px;
        max-width: 24ch;
      }
      .panel label.row {
        align-items: center;
      }
      .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .panel input {
        width: 5.5ch;
        padding: 2px 4px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        text-align: right;
      }
      .panel input:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .unit {
        color: #9a978f;
      }
      .panel .reset {
        margin-top: 4px;
        padding: 5px 8px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
      }
      .panel .reset:hover {
        border-color: #5b9dff;
      }
      .floors {
        position: fixed;
        bottom: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .floors strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .swatches {
        display: flex;
        gap: 6px;
      }
      /* Space between finish groups (floor, walls) inside the one picker box. */
      .floors .swatches + strong {
        margin-top: 6px;
      }
      .swatch {
        padding: 5px 9px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
      }
      .swatch:hover {
        border-color: #6b7078;
      }
      .swatch.active {
        border-color: #5b9dff;
        color: #ffffff;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8e6e1;
        font: 14px ui-monospace, monospace;
      }
      .overlay h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: 0.04em;
      }
      .overlay .sub {
        margin: 0 0 22px;
        color: #9a978f;
      }
      .choose {
        text-align: center;
        padding: 32px;
      }
      .cards {
        display: flex;
        gap: 16px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 150px;
        padding: 22px 16px;
        border: 1px solid #3a3d44;
        border-radius: 10px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
        transition: border-color 0.12s;
      }
      .card:hover {
        border-color: #5b9dff;
      }
      .card-title {
        font-size: 17px;
        font-weight: bold;
      }
      .card-blurb {
        color: #9a978f;
        font-size: 12px;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 300px;
        padding: 26px 28px;
        border: 1px solid #3a3d44;
        border-radius: 10px;
        background: #1c1f25;
      }
      .feet-inches .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .feet-inches input {
        width: 4ch;
      }
      .form input,
      .draw-bar input {
        padding: 3px 5px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #14161a;
        color: #e8e6e1;
        font: inherit;
        text-align: right;
      }
      .form input:focus,
      .draw-bar input:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .form-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }
      .primary {
        padding: 6px 14px;
        border: 1px solid #5b9dff;
        border-radius: 4px;
        background: #2a4a7a;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      .primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .draw {
        align-items: stretch;
        justify-content: stretch;
      }
      .draw-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .draw-bar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #000000cc;
        font: 12px ui-monospace, monospace;
        white-space: nowrap;
      }
      .draw-bar .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .draw-bar input {
        width: 4ch;
      }
      .draw-actions {
        display: flex;
        gap: 8px;
      }
      .room {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .room strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .room .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .room input {
        width: 4ch;
        padding: 2px 4px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        text-align: right;
      }
      .room input:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .banner {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 8px;
        background: #2a4a7ad9;
        color: #ffffff;
        font: 12px ui-monospace, monospace;
      }
      .panel-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .panel-actions .reset {
        flex: 1;
        margin-top: 0;
      }
      .reset.danger {
        border-color: #5a3a3a;
      }
      .reset.danger:hover {
        border-color: #ff8f7a;
        color: #ff8f7a;
      }
      /* Furniture catalog — floating window on the right. */
      .catalog {
        position: fixed;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        width: 236px;
        max-height: 66vh;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000c4;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .catalog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .catalog-head strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .catalog-search {
        width: 11ch;
        padding: 3px 6px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
      }
      .catalog-search:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .catalog-cats {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 8px;
      }
      .cat {
        padding: 3px 8px;
        border: 1px solid #3a3d44;
        border-radius: 999px;
        background: #1c1f25;
        color: #c9c6bf;
        font: inherit;
        cursor: pointer;
      }
      .cat:hover {
        border-color: #6b7078;
      }
      .cat.active {
        border-color: #5b9dff;
        color: #ffffff;
      }
      .catalog-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .catalog-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 6px;
        border: 1px solid #3a3d44;
        border-radius: 8px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .catalog-card:hover {
        border-color: #5b9dff;
      }
      .thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 6px;
        background: #0f1114;
        overflow: hidden;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .thumb-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #3a3d44;
        border-top-color: #5b9dff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .card-name {
        font-size: 11px;
        line-height: 1.2;
      }
      .card-dims {
        font-size: 10px;
        color: #9a978f;
      }
      .catalog-empty {
        grid-column: 1 / -1;
        color: #9a978f;
      }

      /* Bullpen — a strip of set-aside items along the bottom centre. */
      .bullpen {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        max-width: 60vw;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #000000c4;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .bullpen-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .bullpen-head strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .bullpen-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .bullpen-card {
        position: relative;
        flex: 0 0 auto;
        width: 84px;
      }
      .bullpen-reimport {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        padding: 6px;
        border: 1px solid #3a3d44;
        border-radius: 8px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .bullpen-reimport:hover {
        border-color: #5b9dff;
      }
      .bullpen-discard {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #3a3d44;
        border-radius: 50%;
        background: #1c1f25;
        color: #c9c6bf;
        font: 10px ui-monospace, monospace;
        cursor: pointer;
      }
      .bullpen-discard:hover {
        border-color: #d66;
        color: #f2b8b8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
