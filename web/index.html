<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spacelab</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #14161a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 190px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
        pointer-events: none;
      }
      .hud strong {
        margin-bottom: 5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .hud button,
      .hud input {
        pointer-events: auto;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .row span:first-child {
        color: #9a978f;
      }
      .hint {
        margin-top: 8px;
        color: #9a978f;
      }
      .error {
        color: #ff8f7a;
        max-width: 30ch;
      }
      .panel {
        position: fixed;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 190px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .panel strong {
        margin-bottom: 2px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .panel .hint {
        margin: 0 0 4px;
        max-width: 24ch;
      }
      .panel label.row {
        align-items: center;
      }
      .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .panel input {
        width: 5.5ch;
        padding: 2px 4px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        text-align: right;
      }
      .panel input:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .unit {
        color: #9a978f;
      }
      .panel .reset {
        margin-top: 4px;
        padding: 5px 8px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
      }
      .panel .reset:hover {
        border-color: #5b9dff;
      }
      .floors {
        position: fixed;
        bottom: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .floors strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .swatches {
        display: flex;
        gap: 6px;
      }
      /* Space between finish groups (floor, walls) inside the one picker box. */
      .floors .swatches + strong {
        margin-top: 6px;
      }
      .swatch {
        padding: 5px 9px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
      }
      .swatch:hover {
        border-color: #6b7078;
      }
      .swatch.active {
        border-color: #5b9dff;
        color: #ffffff;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8e6e1;
        font: 14px ui-monospace, monospace;
      }
      .overlay h1 {
        margin: 0 0 4px;
        font-size: 22px;
        letter-spacing: 0.04em;
      }
      .overlay .sub {
        margin: 0 0 22px;
        color: #9a978f;
      }
      .choose {
        text-align: center;
        padding: 32px;
      }
      .cards {
        display: flex;
        gap: 16px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 150px;
        padding: 22px 16px;
        border: 1px solid #3a3d44;
        border-radius: 10px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
        transition: border-color 0.12s;
      }
      .card:hover {
        border-color: #5b9dff;
      }
      .card-title {
        font-size: 17px;
        font-weight: bold;
      }
      .card-blurb {
        color: #9a978f;
        font-size: 12px;
      }
      .form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 300px;
        padding: 26px 28px;
        border: 1px solid #3a3d44;
        border-radius: 10px;
        background: #1c1f25;
      }
      .feet-inches .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .feet-inches input {
        width: 4ch;
      }
      .form input,
      .draw-bar input {
        padding: 3px 5px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #14161a;
        color: #e8e6e1;
        font: inherit;
        text-align: right;
      }
      .form input:focus,
      .draw-bar input:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .form-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }
      .primary {
        padding: 6px 14px;
        border: 1px solid #5b9dff;
        border-radius: 4px;
        background: #2a4a7a;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      .primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .draw {
        align-items: stretch;
        justify-content: stretch;
      }
      .draw-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .draw-bar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #000000cc;
        font: 12px ui-monospace, monospace;
        white-space: nowrap;
      }
      .draw-bar .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .draw-bar input {
        width: 4ch;
      }
      .draw-actions {
        display: flex;
        gap: 8px;
      }
      .room {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000aa;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .room strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .room .field {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .room input {
        width: 4ch;
        padding: 2px 4px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        text-align: right;
      }
      .room input:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .banner {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 8px;
        background: #2a4a7ad9;
        color: #ffffff;
        font: 12px ui-monospace, monospace;
      }
      .panel-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .panel-actions .reset {
        flex: 1;
        margin-top: 0;
      }
      .reset.danger {
        border-color: #5a3a3a;
      }
      .reset.danger:hover {
        border-color: #ff8f7a;
        color: #ff8f7a;
      }
      /* Furniture catalog — floating window on the right. */
      .catalog {
        position: fixed;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        width: 236px;
        max-height: 66vh;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000c4;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .catalog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .catalog-head strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .catalog-count {
        padding: 0 6px;
        border-radius: 999px;
        background: #2a2d33;
        color: #c9c6bf;
        font-size: 10px;
        letter-spacing: 0;
      }
      .catalog-search {
        width: 11ch;
        padding: 3px 6px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
      }
      .catalog-search:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .catalog-cats {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 8px;
      }
      .cat {
        padding: 3px 8px;
        border: 1px solid #3a3d44;
        border-radius: 999px;
        background: #1c1f25;
        color: #c9c6bf;
        font: inherit;
        cursor: pointer;
      }
      .cat:hover {
        border-color: #6b7078;
      }
      .cat.active {
        border-color: #5b9dff;
        color: #ffffff;
      }
      .catalog-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .catalog-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 6px;
        border: 1px solid #3a3d44;
        border-radius: 8px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .catalog-card:hover {
        border-color: #5b9dff;
      }
      .thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 6px;
        background: #0f1114;
        overflow: hidden;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .thumb-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid #3a3d44;
        border-top-color: #5b9dff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .card-name {
        font-size: 11px;
        line-height: 1.2;
      }
      .card-dims {
        font-size: 10px;
        color: #9a978f;
      }
      .catalog-empty {
        grid-column: 1 / -1;
        color: #9a978f;
      }

      /* AI style search — sits at the top of the catalog panel. */
      .ai {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #2a2d33;
      }
      .ai-head strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .ai-input {
        display: flex;
        gap: 6px;
      }
      .ai-prompt {
        flex: 1;
        min-width: 0;
        padding: 4px 7px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
      }
      .ai-prompt:focus {
        outline: none;
        border-color: #5b9dff;
      }
      .ai-go {
        padding: 4px 10px;
        border: 1px solid #5b9dff;
        border-radius: 4px;
        background: #29405f;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      .ai-go:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .ai-proposal {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 8px;
        border: 1px solid #3a3d44;
        border-radius: 8px;
        background: #12151a;
      }
      .ai-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        text-transform: capitalize;
        color: #e8e6e1;
      }
      .ai-source {
        flex: none;
        padding: 1px 6px;
        border-radius: 999px;
        background: #23303f;
        color: #7fb0ff;
        font-size: 9px;
        font-weight: 500;
        text-transform: none;
        white-space: nowrap;
      }
      .ai-why {
        margin: 0;
        font-size: 10px;
        line-height: 1.3;
        color: #9a978f;
      }
      .ai-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .ai-chip {
        position: relative;
        width: 40px;
      }
      .ai-chip .thumb {
        aspect-ratio: 1 / 1;
      }
      .ai-count {
        position: absolute;
        right: -3px;
        bottom: -3px;
        padding: 0 3px;
        border-radius: 6px;
        background: #5b9dff;
        color: #0f1114;
        font-size: 9px;
        font-weight: 700;
      }
      .ai-finishes {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .ai-finishes span {
        padding: 2px 6px;
        border-radius: 999px;
        background: #1c1f25;
        color: #c9c6bf;
        font-size: 10px;
      }
      .ai-actions {
        display: flex;
        gap: 6px;
      }
      .ai-apply {
        flex: 1;
        padding: 5px 8px;
        border: 1px solid #5b9dff;
        border-radius: 4px;
        background: #29405f;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      .ai-apply:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .ai-actions .reset {
        padding: 5px 8px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
      }
      .ai-actions .reset:hover {
        border-color: #5b9dff;
      }

      /* Bullpen — a strip of set-aside items along the bottom centre. */
      .bullpen {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        max-width: 60vw;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #000000c4;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .bullpen-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .bullpen-head strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .bullpen-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .bullpen-card {
        position: relative;
        flex: 0 0 auto;
        width: 84px;
      }
      .bullpen-reimport {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 100%;
        padding: 6px;
        border: 1px solid #3a3d44;
        border-radius: 8px;
        background: #1c1f25;
        color: #e8e6e1;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .bullpen-reimport:hover {
        border-color: #5b9dff;
      }
      .bullpen-discard {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #3a3d44;
        border-radius: 50%;
        background: #1c1f25;
        color: #c9c6bf;
        font: 10px ui-monospace, monospace;
        cursor: pointer;
      }
      .bullpen-discard:hover {
        border-color: #d66;
        color: #f2b8b8;
      }

      /* Editor's top-right link back to accounts + manual save-to-portfolio */
      .editor-nav {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        background: #000000aa;
        font: 12px ui-monospace, monospace;
      }
      .editor-nav-name {
        max-width: 22ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #9a978f;
      }

      /* Controls legend — key/mouse bindings, middle-left. Shares that edge with the
         selection panel (z-index 5); the legend sits under it so a selected piece's
         panel wins, and the legend can be collapsed out of the way. */
      .legend {
        position: fixed;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 168px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #000000c4;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      .legend-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .legend-head strong {
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .legend-hide {
        padding: 0 4px;
        border: none;
        background: transparent;
        color: #9a978f;
        font: inherit;
        cursor: pointer;
        line-height: 1;
      }
      .legend-hide:hover {
        color: #e8e6e1;
      }
      .legend-group {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .legend-group-name {
        margin-bottom: 2px;
        color: #7f7c74;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend-row kbd {
        flex: none;
        min-width: 44px;
        padding: 2px 5px;
        border: 1px solid #3a3d44;
        border-radius: 4px;
        background: #1c1f25;
        color: #c9c6bf;
        font: 11px ui-monospace, monospace;
        text-align: center;
      }
      .legend-row span {
        color: #9a978f;
      }
      /* Collapsed state — a single round toggle in the same spot. */
      .legend-toggle {
        position: fixed;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        z-index: 4;
        width: 32px;
        height: 32px;
        border: 1px solid #3a3d44;
        border-radius: 50%;
        background: #000000c4;
        color: #c9c6bf;
        font: 14px ui-monospace, monospace;
        cursor: pointer;
      }
      .legend-toggle:hover {
        border-color: #5b9dff;
        color: #ffffff;
      }

      /* === Accounts: landing + dashboard =============================== */
      .auth-screen,
      .dash {
        position: fixed;
        inset: 0;
        overflow: auto;
        background: radial-gradient(120% 90% at 50% -10%, #1c2230 0%, #14161a 60%);
        color: #e8e6e1;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .auth-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .auth-card {
        width: 100%;
        max-width: 440px;
        padding: 40px 36px;
        border: 1px solid #2a2e36;
        border-radius: 16px;
        background: #171a20cc;
        backdrop-filter: blur(6px);
        box-shadow: 0 24px 60px #0008;
      }
      .auth-brand {
        font: 12px ui-monospace, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .auth-title {
        margin: 14px 0 8px;
        font-size: 26px;
        line-height: 1.2;
      }
      .auth-sub {
        margin: 0 0 26px;
        color: #a7a49c;
        line-height: 1.5;
      }
      .auth-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .auth-google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 16px;
        border: 1px solid #3a3d44;
        border-radius: 10px;
        background: #f7f7f5;
        color: #202124;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .auth-google:hover:not(:disabled) {
        background: #fff;
      }
      .auth-google:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .auth-ghost {
        padding: 10px 16px;
        border: 1px solid #2a2e36;
        border-radius: 10px;
        background: transparent;
        color: #cfccc4;
        font-size: 14px;
        cursor: pointer;
      }
      .auth-ghost:hover {
        border-color: #5b9dff;
        color: #e8e6e1;
      }
      .auth-notice,
      .auth-error {
        margin: 18px 0 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
      }
      .auth-notice {
        background: #23272f;
        color: #b7c4d8;
      }
      .auth-error {
        background: #3a2020;
        color: #ff9d8a;
      }
      .auth-notice code {
        font: 12px ui-monospace, monospace;
        color: #e8e6e1;
      }
      .auth-fineprint {
        margin: 20px 0 0;
        font-size: 12px;
        color: #7f7c74;
      }
      .auth-muted {
        color: #9a978f;
        font-family: system-ui, sans-serif;
      }

      /* Dashboard */
      .dash-top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 24px;
        border-bottom: 1px solid #23262e;
        background: #14161ae6;
        backdrop-filter: blur(8px);
      }
      .dash-brand {
        font: 12px ui-monospace, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a978f;
      }
      .dash-tabs {
        display: flex;
        gap: 4px;
      }
      .dash-tab {
        padding: 6px 14px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #a7a49c;
        font-size: 14px;
        cursor: pointer;
      }
      .dash-tab.active {
        background: #23272f;
        color: #e8e6e1;
      }
      .dash-who {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dash-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid #3a3d44;
      }
      .dash-body {
        max-width: 1000px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      .dash-error {
        max-width: 1000px;
        margin: 16px auto 0;
      }
      .dash-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }
      .dash-h1 {
        margin: 0;
        font-size: 24px;
      }
      .dash-hello {
        margin: 6px 0 0;
        color: #a7a49c;
      }
      .dash-folders {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
      }
      .dash-chip {
        display: inline-flex;
        align-items: center;
        border: 1px solid #2a2e36;
        border-radius: 999px;
        background: #1a1d23;
        overflow: hidden;
      }
      .dash-chip.active {
        border-color: #5b9dff;
        background: #1d2534;
      }
      .dash-chip-main {
        padding: 6px 12px;
        border: none;
        background: transparent;
        color: #d7d4cc;
        font-size: 13px;
        cursor: pointer;
      }
      .dash-chip-count {
        color: #7f7c74;
        font-size: 11px;
      }
      .dash-chip-x {
        padding: 6px 8px 6px 2px;
        border: none;
        background: transparent;
        color: #7f7c74;
        font-size: 11px;
        cursor: pointer;
      }
      .dash-chip-x:hover {
        color: #f2b8b8;
      }
      .dash-chip-new {
        padding: 6px 14px;
        border: 1px dashed #3a3d44;
        border-radius: 999px;
        background: transparent;
        color: #a7a49c;
        font-size: 13px;
        cursor: pointer;
      }
      .dash-chip-new:hover {
        border-color: #5b9dff;
        color: #e8e6e1;
      }
      .dash-grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .card-room {
        display: flex;
        flex-direction: column;
        border: 1px solid #2a2e36;
        border-radius: 12px;
        background: #1a1d23;
        overflow: hidden;
      }
      .card-room-thumb {
        aspect-ratio: 4 / 3;
        border: none;
        border-bottom: 1px solid #2a2e36;
        background: #12141a;
        color: #6b6860;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-room-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-room-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px 6px;
      }
      .card-room-name {
        font-size: 14px;
      }
      .card-room-date {
        font-size: 12px;
        color: #7f7c74;
      }
      .card-room-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 12px;
      }
      .card-room-move {
        margin-left: auto;
        padding: 3px 6px;
        border: 1px solid #3a3d44;
        border-radius: 6px;
        background: #14161a;
        color: #cfccc4;
        font: 11px system-ui, sans-serif;
      }
      .dash-empty {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 48px 0;
      }
      .dash-empty-title {
        margin: 0;
        font-size: 18px;
      }
      .dash-settings {
        max-width: 640px;
      }
      .settings-card {
        margin-top: 20px;
        padding: 20px;
        border: 1px solid #2a2e36;
        border-radius: 12px;
        background: #1a1d23;
      }
      .settings-h2 {
        margin: 0 0 14px;
        font-size: 15px;
        color: #cfccc4;
      }
      .settings-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .settings-row span {
        font-size: 13px;
        color: #a7a49c;
      }
      .settings-row input {
        padding: 9px 11px;
        border: 1px solid #3a3d44;
        border-radius: 8px;
        background: #14161a;
        color: #e8e6e1;
        font-size: 14px;
      }
      .settings-ro {
        color: #9a978f !important;
      }
      .settings-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .settings-saved {
        color: #7fd08a;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
