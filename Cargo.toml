[workspace]
members = ["crates/core-scene", "crates/core-geometry", "crates/wasm-bindings"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
core-scene = { path = "crates/core-scene" }
core-geometry = { path = "crates/core-geometry" }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
